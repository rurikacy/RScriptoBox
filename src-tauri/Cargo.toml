[package]
name = "rscripto-box"
version = "0.2.0"
description = "A lightweight Windows script toolbox"
edition = "2021"
license = "Unlicense"
default-run = "rscripto-box"

[lib]
name = "rscripto_box_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
encoding_rs = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects",
  "Win32_System_Pipes", "Win32_System_Threading", "Win32_Globalization",
] }
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem",
  "Win32_System_Console", "Win32_System_Environment", "Win32_System_SystemInformation",
  "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
